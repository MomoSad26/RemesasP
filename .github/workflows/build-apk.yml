name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install PWA2APK
      run: npm install -g pwa2apk
    
    - name: Build APK
      run: |
        pwa2apk \
          --name "Mi App" \
          --short-name "MiApp" \
          --description "Mi aplicación Android" \
          --start-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
          --display "standalone" \
          --orientation "portrait" \
          --background-color "#ffffff" \
          --theme-color "#000000" \
          --icon "icons/icon-512.png" \
          --output "mi-app.apk"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mi-app
        path: mi-app.apk
