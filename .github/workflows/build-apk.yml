name: Build APK Offline con Bubblewrap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Setup Java (necesario para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Verificar Java
      run: |
        echo "✅ Java instalado:"
        java -version
        echo "✅ JAVA_HOME: $JAVA_HOME"
    
    - name: Instalar Bubblewrap
      run: npm install -g @bubblewrap/cli
    
    - name: Verificar archivos locales
      run: |
        echo "📁 Archivos en el repositorio:"
        ls -la
        
        if [ ! -f "index.html" ]; then
          echo "❌ FALTA index.html"
          exit 1
        fi
        echo "✅ index.html existe"
        
        if [ ! -f "manifest.json" ]; then
          echo "❌ FALTA manifest.json"
          exit 1
        fi
        echo "✅ manifest.json existe"
    
    - name: Configurar Bubblewrap (sin preguntas interactivas)
      run: |
        cat > twa-manifest.json << 'EOF'
        {
          "name": "Mi App Offline",
          "shortName": "MiApp",
          "description": "Aplicación completamente offline",
          "launchUrl": "https://localhost/index.html",
          "startUrl": "/index.html",
          "themeColor": "#000000",
          "backgroundColor": "#ffffff",
          "display": "standalone",
          "orientation": "portrait",
          "icons": [
            {
              "src": "icons/icon-512.png",
              "sizes": "512x512",
              "type": "image/png",
              "purpose": "any"
            }
          ],
          "signing": {
            "keystorePath": "debug.keystore",
            "keystorePassword": "android",
            "keyAlias": "androiddebugkey",
            "keyPassword": "android"
          }
        }
        EOF
        
        echo "✅ Configuración creada"
        cat twa-manifest.json
    
    - name: Inicializar Bubblewrap (sin preguntas)
      run: |
        # Forzamos a usar el JDK existente con --skip-install
        bubblewrap init --manifest twa-manifest.json --skip-install
        
    - name: Construir APK
      run: |
        bubblewrap build
        
        # Buscar el APK generado
        if [ -f "app-release-unsigned.apk" ]; then
          cp app-release-unsigned.apk mi-app-offline.apk
          echo "✅ APK release generado"
        elif [ -f "app-debug.apk" ]; then
          cp app-debug.apk mi-app-offline.apk
          echo "✅ APK debug generado"
        else
          echo "❌ No se encontró el APK"
          find . -name "*.apk" -type f
          exit 1
        fi
    
    - name: Verificar APK
      run: |
        if [ -f "mi-app-offline.apk" ]; then
          echo "✅ APK OFFLINE creado exitosamente"
          echo "📦 Tamaño:"
          ls -lh mi-app-offline.apk
        else
          echo "❌ No se generó el APK"
          exit 1
        fi
    
    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: mi-app-offline
        path: mi-app-offline.apk
