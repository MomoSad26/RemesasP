name: Build APK Offline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Instalar herramientas
      run: |
        npm install -g pwa-to-apk
        npm install -g http-server
    
    - name: Crear versión offline
      run: |
        # Asegurarnos de que todos los archivos están en el directorio correcto
        mkdir -p app-assets
        cp -r index.html app.js styles.css manifest.json app-assets/ 2>/dev/null || true
        cp -r icons app-assets/ 2>/dev/null || true
        
        # Crear un pequeño servidor local para los archivos
        cd app-assets
        cat > package.json << 'EOF'
        {
          "name": "offline-app",
          "version": "1.0.0",
          "scripts": {
            "start": "http-server -p 8080"
          }
        }
        EOF
        
        # Crear un index.html que cargue los archivos locales
        cat > index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Mi App Offline</title>
          <link rel="stylesheet" href="styles.css">
          <link rel="manifest" href="manifest.json">
        </head>
        <body>
          <div id="root"></div>
          <script src="app.js"></script>
        </body>
        </html>
        EOF
        
        echo "✅ Archivos preparados para app offline"
        ls -la
    
    - name: Generar APK con archivos locales
      run: |
        cd app-assets
        # Usar pwa-to-apk con los archivos locales
        npx pwa-to-apk . -o ../mi-app-offline.apk
        
    - name: Verificar APK
      run: |
        if [ -f "mi-app-offline.apk" ]; then
          echo "✅ APK OFFLINE creado exitosamente"
          echo "Tamaño:"
          ls -lh mi-app-offline.apk
        else
          echo "❌ No se generó el APK"
          ls -la
          exit 1
        fi
    
    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: mi-app-offline
        path: mi-app-offline.apk
