name: Build APK Offline con Bubblewrap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Setup Java (necesario para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Verificar Java
      run: |
        echo "✅ Java instalado:"
        java -version
        echo "✅ JAVA_HOME: $JAVA_HOME"
    
    - name: Instalar Bubblewrap
      run: npm install -g @bubblewrap/cli
    
    - name: Verificar archivos
      run: |
        echo "📁 Archivos en el repositorio:"
        ls -la
        
        if [ ! -f "index.html" ]; then
          echo "❌ FALTA index.html"
          exit 1
        fi
        echo "✅ index.html existe"
        
        if [ ! -f "manifest.json" ]; then
          echo "❌ FALTA manifest.json"
          exit 1
        fi
        echo "✅ manifest.json existe"
    
    - name: Configurar Bubblewrap
      run: |
        cat > twa-manifest.json << 'EOF'
        {
          "name": "Mi App Offline",
          "shortName": "MiApp",
          "description": "Aplicación completamente offline",
          "launchUrl": "https://localhost/index.html",
          "startUrl": "/index.html",
          "themeColor": "#000000",
          "backgroundColor": "#ffffff",
          "display": "standalone",
          "orientation": "portrait",
          "icons": [
            {
              "src": "icons/icon-512.png",
              "sizes": "512x512",
              "type": "image/png",
              "purpose": "any"
            }
          ],
          "signing": {
            "keystorePath": "debug.keystore",
            "keystorePassword": "android",
            "keyAlias": "androiddebugkey",
            "keyPassword": "android"
          }
        }
        EOF
        
        echo "✅ Configuración creada"
    
    - name: Inicializar Bubblewrap (sin preguntas)
      env:
        BUBBLEWRAP_SKIP_JDK: "true"
        JAVA_HOME: ${{ env.JAVA_HOME }}
      run: |
        echo "🔄 Inicializando Bubblewrap..."
        yes "n" | bubblewrap init --manifest twa-manifest.json || true
        
        # Si falló con "n", intentamos con "yes"
        if [ ! -d "app" ]; then
          echo "🔄 Intentando con respuesta automática 'No'..."
          printf "n\n" | bubblewrap init --manifest twa-manifest.json
        fi
        
        echo "✅ Bubblewrap inicializado"
        ls -la
    
    - name: Construir APK
      run: |
        echo "🔄 Construyendo APK..."
        bubblewrap build || true
        
        # Si falla, intentamos build con --skip-checks
        if [ ! -f "app-release-unsigned.apk" ] && [ ! -f "app-debug.apk" ]; then
          echo "🔄 Reintentando build..."
          bubblewrap build --skip-checks
        fi
        
        # Buscar cualquier APK
        echo "🔍 Buscando APK generado..."
        find . -name "*.apk" -type f
        
        if [ -f "app-release-unsigned.apk" ]; then
          cp app-release-unsigned.apk mi-app-offline.apk
          echo "✅ APK release generado"
        elif [ -f "app-debug.apk" ]; then
          cp app-debug.apk mi-app-offline.apk
          echo "✅ APK debug generado"
        else
          echo "⚠️  No se encontró APK, intentando con otra estrategia..."
          # Intentar con una configuración más simple
          cat > simple-manifest.json << 'EOF'
          {
            "name": "MiApp",
            "shortName": "MiApp",
            "startUrl": "/index.html",
            "display": "standalone",
            "icons": []
          }
          EOF
          rm -rf app twa-manifest.json
          printf "n\n" | bubblewrap init --manifest simple-manifest.json
          bubblewrap build
          find . -name "*.apk" -type f -exec cp {} mi-app-offline.apk \;
        fi
        
        if [ -f "mi-app-offline.apk" ]; then
          echo "✅ APK OFFLINE creado exitosamente"
          ls -lh mi-app-offline.apk
        else
          echo "❌ No se generó el APK"
          exit 1
        fi
    
    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: mi-app-offline
        path: mi-app-offline.apk
